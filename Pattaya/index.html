                    items: [
                        { time: "下午", title: "專車直達・入住濱海飯店", icon: "fa-car", details: "<p>從曼谷機場入境後，搭乘預約的專車直奔熱情的芭達雅，車程約1.5-2小時。選擇入住海灘路（Beach Road）周邊的飯店，方便體驗這座城市的活力。</p><p><strong>推薦住宿：</strong>芭達雅希爾頓酒店 或 芭達雅硬石酒店。</p>" },
                        { time: "傍晚", title: "備戰採買・決戰裝備購置", icon: "fa-shopping-cart", details: "<p>前往芭達雅最醒目的地標之一 <strong>Terminal 21 Pattaya</strong> 商場。我們的首要任務是為明日的潑水節大戰採購完美裝備！</p><ul class='list-disc list-inside mt-2 text-sm'><li><i class='fas fa-shield-alt mr-2 text-sky-500'></i>專業手機防水袋</li><li><i class='fas fa-glasses mr-2 text-sky-500'></i>護目鏡（保護眼睛不受強力水柱攻擊）</li><li><i class='fas fa-crosshairs mr-2 text-sky-500'></i>強力水槍</li><li><i class='fas fa-tshirt mr-2 text-sky-500'></i>一件色彩鮮豔的泰式花襯衫</li></ul>" },

                day2: {

                        { icon: "fa-crab", text: "戰後海鮮盛宴" }

                    locations: {
                        "芭達雅海灘路戰區": { lat: 12.930, lon: 100.885 }
                    },
                    items: [
                        { time: "上午", title: "自然醒・戰前整備", icon: "fa-sun", details: "<p>睡到自然醒，為身體充滿電。出門前務必塗好高係數的防水防曬乳，並將所有貴重物品（護照、錢包、無防水的手機）鎖在飯店保險箱。</p>" },
                        { time: "下午", title: "全面開戰・濕身大作戰", icon: "fa-faucet-drip", details: "<p>直奔海灘路一級戰區！跟著路邊的消防車、臨時補水站和泡沫派對，與來自世界各地的遊客一同陷入瘋狂的水戰。感受重低音響徹雲霄，享受無差別攻擊的濕身快感！</p><div class='mt-4 p-3 bg-yellow-100 border-l-4 border-yellow-400 text-yellow-800 text-sm rounded-r-lg'><p><strong><i class='fas fa-exclamation-triangle mr-2'></i>重要提示：</strong>水戰當天隨身重要物品（少量現金、護照影本）請務必裝入專業防水袋，盡量勿帶未具防水功能的相機。</p></div>" },

                    ]

                    themeImage: "images/真理寺.jpg",
                    highlights: [

                    locations: {

                        "真理寺": { lat: 12.972, lon: 100.889 },
                        "中天海灘": { lat: 12.885, lon: 100.883 }
                    },
                    items: [
                        { time: "上午", title: "跳島之旅・格蘭島的呼喚", icon: "fa-ship", details: "<p>從<strong>峇里海碼頭（Bali Hai Pier）</strong>搭乘快艇，僅需15分鐘即可抵達被譽為「珊瑚島」的格蘭島。上午的海水最為清澈，推薦在 <strong>Tien Beach</strong> 或 <strong>Tawaen Beach</strong> 的躺椅上放空、喝冰涼的椰子水，或體驗刺激的水上活動。</p>" },
                        { time: "下午", title: "返航・為朝聖做準備", icon: "fa-person-walking-luggage", details: "<p>約13:30搭船返回芭達雅市區。回飯店徹底沖洗，換上合乎寺廟禮儀的乾爽服裝（過膝褲/裙、不露肩膀的上衣），準備前往下一個神聖的目的地。</p>" },
                        { time: "傍晚", title: "真理寺・黃昏下的木雕神話", icon: "fa-gopuram", details: "<p>前往<strong>真理寺（The Sanctuary of Truth）</strong>，這座全球最大的純木雕聖殿將讓你嘆為觀止。欣賞工匠們精湛的手雕工藝，並靜待傍晚時分，夕陽斜射在木造廊柱上，形成壯麗而神聖的光影。</p><div class='mt-4 p-3 bg-blue-100 border-l-4 border-blue-400 text-blue-800 text-sm rounded-r-lg'><p><strong><i class='fas fa-tshirt mr-2'></i>服儀提醒：</strong>真理寺嚴格禁止穿著無袖背心、短裙及高於膝蓋的短褲，請務必更換合規服裝。</p></div>" },
                        { time: "晚上", title: "中天海灘・寧靜的晚餐", icon: "fa-moon", details: "<p>遠離芭達雅市中心的喧囂，前往相對寧靜的<strong>中天海灘（Jomtien Beach）</strong>。在這裡的景觀餐廳或在地夜市享用晚餐，享受更為悠閒的夜晚。</p>" }

                        { time: "下午", title: "東芭樂園・漫步奇幻花園", icon: "fa-tree", details: "<p>前往旁大的<strong>東芭樂園（Nong Nooch Tropical Garden）</strong>。漫步在天空步道上，俯瞰精心設計的法式幾何花園、奇特的仙人掌園，以及栩栩如生的恐龍谷，彷彿進入一個奇幻世界。</p>" },
                        { time: "傍晚", title: "啟程・返回曼谷", icon: "fa-road", details: "<p>約16:00從東芭樂園出發，包車返回曼谷市區，車程約2小時。入住市區飯店，為接下來的城市探索做準備。</p><div class='mt-4 p-3 bg-red-100 border-l-4 border-red-400 text-red-800 text-sm rounded-r-lg'><p><strong><i class='fas fa-traffic-light mr-2'></i>交通提示：</strong>為避開下班尖峰時段的嚴重塞車，建議預留充裕的交通時間返回曼谷。</p></div>" },

                    ],
                    locations: {
                        "Siam Paragon": { lat: 13.746, lon: 100.534 },
                        "Central World": { lat: 13.746, lon: 100.539 },
                        "Big C Supercenter": { lat: 13.747, lon: 100.542 },
                        "ICONSIAM": { lat: 13.726, lon: 100.510 }
                    },
                    items: [
                        { time: "白天", title: "BTS暢遊・心臟商圈巡禮", icon: "fa-shopping-bag", details: "<p>搭乘BTS空鐵，輕鬆暢遊曼谷最核心的商圈。從 <strong>Siam Paragon</strong> 的國際精品到 <strong>Central World</strong> 的潮流品牌，以及泰國本地特色的設計與香氛，滿足你的所有購物慾望。</p>" },
                        { time: "下午", title: "伴手禮採買 & SPA放鬆", icon: "fa-gifts", details: "<p>前往 <strong>Big C Supercenter (Rajdamri)</strong> 進行最後的伴手禮大採買，將泰國的美味零食打包回家。隨後，安排一場約2小時的泰式傳統按摩或精油SPA，徹底舒緩旅途中的疲勞。</p>" },
                        { time: "晚上", title: "昭披耶河畔的璀璨", icon: "fa-water", details: "<p>晚餐有兩種絕佳選擇：</p><ul class='list-disc list-inside mt-2 text-sm'><li>前往位於昭披耶河畔的頂級商場 <strong>ICONSIAM</strong>，欣賞壯觀的戶外水舞秀，並逛逛充滿特色的室內水上市場。</li><li>挑選一間能俯瞰曼谷夜景的高空酒吧，在百萬夜景的陪伴下，享受一個微醺的浪漫夜晚。</li></ul>" }
                    ]
                },
                day6: {
                    title: "告別曼谷・滿載而歸",
                    themeImage: "images/蘇凡納布機場.jpg",
                    highlights: [
                        { icon: "fa-coffee", text: "悠閒早午餐" },
                        { icon: "fa-plane-departure", text: "機場專車返台" }
                    ],
                    locations: {},
                    items: [
                        { time: "上午", title: "悠閒早午餐・最後巡禮", icon: "fa-coffee", details: "<p>在飯店享用豐盛的早餐，或是尋找一間有質感的文青咖啡廳，品嚐一杯手沖咖啡，為這趟旅程寫下悠閒的註腳。整理行李並辦理退房。</p>" },
                        { time: "下午", title: "機場專車・返台", icon: "fa-plane-departure", details: "<p>為確保有充裕的時間辦理登機與退稅手續，請<strong>務必提前3.5小時</strong>搭乘預約的專車前往蘇凡納布（BKK）或廊曼（DMK）機場。</p><div class='mt-4 p-3 bg-red-100 border-l-4 border-red-400 text-red-800 text-sm rounded-r-lg'><p><strong><i class='fas fa-traffic-light mr-2'></i>交通提示：</strong>前往機場的交通狀況難以預測，強烈建議預留充裕的交通時間以避開可能的塞車。</p></div>" }
                    ]
                }
            };

            // --- INITIALIZATION ---
            let map;
            let markers = [];

            function setupPage() {
                setupAnimations();
                setupCountdown();
                setupWeather();
                setupMap();
                generateDailySections();
                setupTabSwitching();
                setupScrollToTop();
                setupChart();
                
                window.addEventListener('load', () => {
                    document.querySelector('.preloader')?.classList.add('hidden');
                    document.body.classList.add('loaded');
                    isAnimating = true;
                    switchTab('overview', false, () => { isAnimating = false; });
                });
            }
            
            setupPage();

            // --- SETUP FUNCTIONS ---

            function setupWeather() {
                const weatherIconMap = { "Sunny": "fa-sun", "Clear": "fa-moon", "Partly cloudy": "fa-cloud-sun", "Cloudy": "fa-cloud", "Overcast": "fa-smog", "Mist": "fa-smog", "Patchy rain possible": "fa-cloud-showers-heavy", "Thundery outbreaks possible": "fa-bolt", "Light rain": "fa-cloud-rain", "Moderate rain": "fa-cloud-showers-heavy", "Heavy rain": "fa-cloud-showers-heavy", "Light rain shower": "fa-cloud-rain" };
                const weatherDescTranslations = { "Sunny": "晴朗", "Clear": "晴朗", "Partly cloudy": "多雲時晴", "Cloudy": "多雲", "Overcast": "陰天", "Mist": "有霧", "Patchy rain possible": "可能有零星降雨", "Thundery outbreaks possible": "可能有雷暴", "Light rain": "小雨", "Moderate rain": "中雨", "Heavy rain": "大雨", "Light rain shower": "陣雨" };

                fetch('https://wttr.in/Pattaya?format=j1')
                    .then(response => response.json())
                    .then(data => {
                        const condition = data.current_condition[0];
                        const temp = condition.temp_C;
                        const weatherDesc = condition.weatherDesc[0].value;
                        const iconClass = weatherIconMap[weatherDesc] || 'fa-question-circle';
                        const translatedDesc = weatherDescTranslations[weatherDesc] || weatherDesc;

                        document.getElementById('weather-icon').className = `fas ${iconClass} text-6xl text-sky-400`;
                        document.getElementById('weather-temp').textContent = `${temp}°C`;
                        document.getElementById('weather-desc').textContent = translatedDesc;
                    })
                    .catch(error => {
                        console.error('Error fetching weather:', error);
                        document.getElementById('weather-info').innerHTML = '<div class="text-sm text-slate-500">無法載入天氣資訊</div>';
                    });
            }
            
            function setupAnimations() {
                const heroTitle = document.getElementById('hero-title');
                const text = heroTitle.innerText;
                heroTitle.innerHTML = text.split('').map(char => `<span class="char">${char === ' ' ? '&nbsp;' : char}</span>`).join('');
                gsap.from(heroTitle.querySelectorAll('.char'), { duration: 1.2, y: 100, autoAlpha: 0, stagger: 0.05, ease: "back.out(1.7)" });
                gsap.from("#hero-subtitle", { duration: 1, y: 30, opacity: 0, ease: "power3.out", delay: 1 });
            }
            
            function setupCountdown() {
                const targetDate = new Date('2027-04-12T00:00:00').getTime();
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = targetDate - now;
                    if (distance < 0) {
                        clearInterval(interval);
                        document.getElementById('countdown').innerHTML = "<div class='col-span-4 text-2xl font-bold text-sky-600'>旅程已開始！</div>";
                        return;
                    }
                    document.getElementById('days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById('hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById('minutes').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById('seconds').innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }, 1000);
            }

            function setupMap() {
                map = L.map('map').setView([12.9236, 100.8825], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }).addTo(map);
            }

            function generateDailySections() {
                let allSectionsHtml = Object.keys(itineraryData).map(dayId => {
                    const dayData = itineraryData[dayId];
                    const highlightsHtml = dayData.highlights ? `
                        <div class="mt-4 flex flex-wrap justify-center items-center gap-x-6 gap-y-2 text-sm text-white/90" style="text-shadow: 1px 1px 4px rgba(0,0,0,0.5);">
                            ${dayData.highlights.map(h => `<span class="flex items-center"><i class="fas ${h.icon} mr-2"></i>${h.text}</span>`).join('')}
                        </div>
                    ` : '';
                    const timelineHtml = dayData.items.map(item => `
                        <div class="timeline-item relative mb-8">
                            <div class="icon"><i class="fas ${item.icon}"></i></div>
                            <div class="ml-10 sm:ml-8 bg-white rounded-lg shadow-md overflow-hidden card-hover">
                                <div class="p-4">
                                    <h3 class="text-base sm:text-lg font-bold text-sky-700">${item.time} | ${item.title}</h3>
                                </div>
                                <div class="p-4 bg-gray-50 border-t border-gray-100 text-slate-600">${item.details}</div>
                            </div>
                        </div>
                    `).join('');

                    return `
                        <section id="${dayId}" class="content-section" style="display: none; opacity: 0;">
                            <div class="daily-theme-card cursor-pointer relative rounded-2xl shadow-xl overflow-hidden p-8 md:p-12 text-white flex flex-col justify-center items-center text-center min-h-[300px] mb-12" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${dayData.themeImage}'); background-size: cover; background-position: center;">
                                <h2 class="text-3xl sm:text-4xl font-black mb-2" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.7);">${dayData.title}</h2>
                                ${highlightsHtml}
                                <button class="view-timeline-btn mt-6 bg-sky-500 text-white py-2 px-6 rounded-full shadow-lg hover:bg-sky-600 transition-transform hover:scale-105 flex items-center justify-center">查看詳細行程 <i class="fas fa-chevron-down ml-2"></i></button>
                            </div>
                            <div class="timeline-container hidden relative pl-10 sm:pl-12">
                                <div class="timeline-line"></div>
                                <div class="timeline-line-progress"></div>
                                ${timelineHtml}
                            </div>
                        </section>`;
                }).join('');
                dailySectionsContainer.innerHTML = allSectionsHtml;

                document.querySelectorAll('.daily-theme-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const button = card.querySelector('.view-timeline-btn');
                        const timeline = card.nextElementSibling;
                        if (!timeline || !timeline.classList.contains('timeline-container')) return;

                        const isOpening = timeline.classList.contains('hidden');

                        document.querySelectorAll('.timeline-container:not(.hidden)').forEach(openTimeline => {
                            if (openTimeline !== timeline) {
                                openTimeline.classList.add('hidden');
                                const openButton = openTimeline.previousElementSibling.querySelector('.view-timeline-btn');
                                if (openButton) openButton.innerHTML = '查看詳細行程 <i class="fas fa-chevron-down ml-2"></i>';
                            }
                        });

                        if (isOpening) {
                            timeline.classList.remove('hidden');
                            button.innerHTML = '隱藏詳細行程 <i class="fas fa-chevron-up ml-2"></i>';
                            setTimeout(() => {
                                ScrollTrigger.refresh();
                                gsap.from(timeline.querySelectorAll('.timeline-item'), { opacity: 0, x: -50, stagger: 0.15, duration: 0.7, ease: "power3.out" });
                                gsap.to(timeline.querySelector('.timeline-line-progress'), {
                                    scrollTrigger: { trigger: timeline, start: "top center", end: "bottom bottom", scrub: true },
                                    height: "100%"
                                });
                                gsap.to(window, { duration: 0.8, ease: 'power3.inOut', scrollTo: { y: timeline, offsetY: document.querySelector('nav').offsetHeight + 32 } });
                            }, 10);
                        } else {
                            gsap.to(window, {
                                duration: 0.5, ease: 'power3.inOut',
                                scrollTo: { y: card, offsetY: document.querySelector('nav').offsetHeight + 32 },
                                onComplete: () => {
                                    gsap.to(timeline, {
                                        duration: 0.4, opacity: 0, ease: 'power2.in',
                                        onComplete: () => {
                                            timeline.classList.add('hidden');
                                            timeline.style.opacity = 1;
                                            button.innerHTML = '查看詳細行程 <i class="fas fa-chevron-down ml-2"></i>';
                                        }
                                    });
                                }
                            });
                        }
                    });
                });
            }

            function setupTabSwitching() {
                navButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const targetId = button.dataset.target;
                        if (!isAnimating && targetId !== currentActiveSectionId) {
                            isAnimating = true;
                            switchTab(targetId, true, () => { isAnimating = false; });
                        }
                    });
                });
            }

            function switchTab(targetId, shouldScroll = true, onCompleteCallback = () => {}) {
                const oldSection = currentActiveSectionId ? document.getElementById(currentActiveSectionId) : null;
                const newSection = document.getElementById(targetId);
                if (!newSection) return;

                const tl = gsap.timeline({ onComplete: () => { currentActiveSectionId = targetId; ScrollTrigger.refresh(); onCompleteCallback(); } });
                if (oldSection) {
                    tl.to(oldSection, { duration: 0.3, opacity: 0, ease: 'power2.in', onComplete: () => { oldSection.style.display = 'none'; } });
                }
                
                tl.add(() => {
                    navButtons.forEach(btn => {
                        const isTarget = btn.dataset.target === targetId;
                        btn.classList.toggle('bg-sky-500', isTarget);
                        btn.classList.toggle('text-white', isTarget);
                        btn.classList.toggle('bg-sky-100', !isTarget);
                        btn.classList.toggle('text-sky-800', !isTarget);
                    });
                });

                tl.set(newSection, { display: 'block', opacity: 0 })
                  .to(newSection, {
                    duration: 0.4,
                    opacity: 1,
                    ease: 'power2.out',
                    onStart: () => {
                        updateMapForDay(targetId);
                        gsap.from(newSection.querySelectorAll('.daily-theme-card'), { opacity: 0, y: 50, duration: 0.8, ease: 'power3.out', stagger: 0.1 });
                    }
                });

                if (shouldScroll) {
                    tl.to(window, { duration: 0.8, ease: 'power2.inOut', scrollTo: { y: newSection, offsetY: document.querySelector('nav').offsetHeight + 32 } }, "-=0.2");
                }
            }

            function updateMapForDay(dayId) {
                markers.forEach(marker => map.removeLayer(marker));
                markers = [];

                const dayData = itineraryData[dayId];
                if (!dayData || !dayData.locations || Object.keys(dayData.locations).length === 0) {
                    map.setView([12.9236, 100.8825], 12);
                    return;
                }

                const locations = dayData.locations;
                const bounds = L.latLngBounds();

                for (const name in locations) {
                    const loc = locations[name];
                    const marker = L.marker([loc.lat, loc.lon]).addTo(map).bindPopup(`<b>${name}</b>`);
                    markers.push(marker);
                    bounds.extend([loc.lat, loc.lon]);
                }
                if (bounds.isValid()) { map.fitBounds(bounds, { padding: [50, 50] }); }
            }

            function setupScrollToTop() {
                const btn = document.getElementById('scrollToTopBtn');
                window.addEventListener('scroll', () => {
                    const isVisible = window.scrollY > 300;
                    btn.classList.toggle('opacity-0', !isVisible);
                    btn.classList.toggle('invisible', !isVisible);
                });
                btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            }

            function setupChart() {
                const ctx = document.getElementById('budgetChart').getContext('2d');
                const budgetChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['4/12 (一)', '4/13 (二)', '4/14 (三)', '4/15 (四)', '4/16 (五)', '4/17 (六)'],
                        datasets: [{
                            label: '預估人均支出 (THB)',
                            data: [1200, 1000, 1800, 2500, 3500, 800],
                            backgroundColor: 'rgba(14, 165, 233, 0.6)',
                            borderColor: 'rgba(14, 165, 233, 1)',
                            borderWidth: 1, borderRadius: 5,
                            hoverBackgroundColor: 'rgba(2, 132, 199, 0.8)'
                        }]
                    },
                    options: {
                        animation: false, responsive: true, maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true }, x: { grid: { display: false } } },
                        plugins: { legend: { display: false } }
                    }
                });
                ScrollTrigger.create({
                    trigger: "#budgetChart", start: "top 80%",
                    onEnter: () => { budgetChart.options.animation = { duration: 1500, easing: 'easeOutBounce' }; budgetChart.update(); },
                    once: true
                });
            }
        });
    </script>
</body>
</html>
